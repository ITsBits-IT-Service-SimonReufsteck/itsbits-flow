name: Build and Release Firmware

on:
  push:
    tags:
      - 'fw-v*'

permissions:
  contents: write

jobs:
  setup:
    name: Parse platformio.ini & Version
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.get_envs.outputs.envs }}
      version: ${{ steps.get_version.outputs.version }}
      prerelease: ${{ steps.get_version.outputs.prerelease }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Environments
        id: get_envs
        run: |
          ENVS=$(python3 -c "
          import configparser, json, os, re

          ini_path = 'doorinterface/platformio.ini'
          if not os.path.exists(ini_path):
              raise FileNotFoundError(f'{ini_path} nicht gefunden in {os.getcwd()}')

          config = configparser.ConfigParser(interpolation=None)
          try:
              config.read(ini_path, encoding='utf-8')
              envs = [s[4:] for s in config.sections() if s.startswith('env:')]
          except configparser.Error:
              with open(ini_path, encoding='utf-8') as f:
                  envs = re.findall(r'^\[env:([^\]]+)\]', f.read(), re.MULTILINE)

          if not envs:
              raise ValueError('Keine [env:...] Sektionen gefunden')

          print(json.dumps(envs))
          ")
          echo "Gefundene Environments: $ENVS"
          echo "envs=$ENVS" >> $GITHUB_OUTPUT

      - name: Parse Version & Pre-Release Status
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#fw-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Firmware (${{ matrix.env }})
    needs: setup
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.setup.outputs.envs) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('doorinterface/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build Firmware
        working-directory: doorinterface
        run: pio run -e ${{ matrix.env }}

      - name: Rename Firmware Binary
        working-directory: doorinterface
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          cp .pio/build/${{ matrix.env }}/firmware.bin ../firmware-${VERSION}-${{ matrix.env }}.bin

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware-*-${{ matrix.env }}.bin

  release:
    name: Create GitHub Release
    needs: [setup, build]
    runs-on: ubuntu-latest
    
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.bin
          generate_release_notes: true
          prerelease: ${{ needs.setup.outputs.prerelease }}
