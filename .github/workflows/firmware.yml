name: Build and Release Firmware

on:
  push:
    tags:
      - 'fw-v*' # Startet bei Tags wie fw-v0.1.0-dev oder fw-v0.1.0

permissions:
  contents: write

jobs:
  setup:
    name: Parse platformio.ini & Version
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.get_envs.outputs.envs }}
      version: ${{ steps.get_version.outputs.version }}
      prerelease: ${{ steps.get_version.outputs.prerelease }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Environments
        id: get_envs
        run: |
          ENVS=$(python3 -c "
          import configparser, json
          config = configparser.ConfigParser()
          config.read('platformio.ini')
          envs = [s[4:] for s in config.sections() if s.startswith('env:')]
          print(json.dumps(envs))
          ")
          echo "envs=$ENVS" >> $GITHUB_OUTPUT

      - name: Parse Version & Pre-Release Status
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#fw-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Prüft, ob nach dem Entfernen von 'fw-v' noch ein Bindestrich (z. B. -dev) übrig ist
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Firmware (${{ matrix.env }})
    needs: setup
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.setup.outputs.envs) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build Firmware
        run: pio run -e ${{ matrix.env }}

      - name: Rename Firmware Binary
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          cp .pio/build/${{ matrix.env }}/firmware.bin firmware-${VERSION}-${{ matrix.env }}.bin

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware-*-${{ matrix.env }}.bin

  release:
    name: Create GitHub Release
    needs: [setup, build]
    runs-on: ubuntu-latest
    
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.bin
          generate_release_notes: true
          prerelease: ${{ needs.setup.outputs.prerelease }}
