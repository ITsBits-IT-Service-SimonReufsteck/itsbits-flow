name: Build & Release firmware

on:
  push:
    tags:
      - 'fw-v*'
  workflow_dispatch:

jobs:
  build-esp32dev:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
      channel: ${{ steps.ver.outputs.CHANNEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#fw-v}"
            CHANNEL="release"
          else
            VERSION="0.0.0-dev"
            CHANNEL="development"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "CHANNEL=$CHANNEL" >> $GITHUB_OUTPUT

      - name: Build esp32dev
        working-directory: doorinterface
        run: pio run -e esp32dev

      - name: Upload esp32dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.ver.outputs.VERSION }}-${{ steps.ver.outputs.CHANNEL }}-esp32dev
          path: doorinterface/.pio/build/esp32dev/firmware.bin

  build-waveshare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
      channel: ${{ steps.ver.outputs.CHANNEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#fw-v}"
            CHANNEL="release"
          else
            VERSION="0.0.0-dev"
            CHANNEL="development"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "CHANNEL=$CHANNEL" >> $GITHUB_OUTPUT

      - name: Build waveshare
        working-directory: doorinterface
        run: pio run -e waveshare-esp32-s3-touch-lcd-2

      - name: Upload waveshare artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.ver.outputs.VERSION }}-${{ steps.ver.outputs.CHANNEL }}-waveshare
          path: doorinterface/.pio/build/waveshare-esp32-s3-touch-lcd-2/firmware.bin

  create-release:
    needs: [build-esp32dev, build-waveshare]
    if: startsWith(github.ref, 'refs/tags/fw-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download esp32dev artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.build-esp32dev.outputs.version }}-${{ needs.build-esp32dev.outputs.channel }}-esp32dev
          path: artifacts/esp32dev

      - name: Download waveshare artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.build-waveshare.outputs.version }}-${{ needs.build-waveshare.outputs.channel }}-waveshare
          path: artifacts/waveshare

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Firmware ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/esp32dev/firmware.bin
            artifacts/waveshare/firmware.bin
