name: Build & Release firmware

on:
  push:
    tags:
      - 'fw-v*'
  workflow_dispatch:

jobs:
  build-esp32dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#fw-v}"
            CHANNEL="release"
          else
            VERSION="0.0.0-dev"
            CHANNEL="development"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "CHANNEL=$CHANNEL" >> $GITHUB_OUTPUT

      - name: Build esp32dev
        run: pio run -e esp32dev

      - name: Upload esp32dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.ver.outputs.VERSION }}-${{ steps.ver.outputs.CHANNEL }}-esp32dev
          path: .pio/build/esp32dev/firmware.bin

      - name: Create Release (esp32dev)
        if: startsWith(github.ref, 'refs/tags/fw-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Firmware ${{ steps.ver.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: .pio/build/esp32dev/firmware.bin

  build-waveshare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#fw-v}"
            CHANNEL="release"
          else
            VERSION="0.0.0-dev"
            CHANNEL="development"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "CHANNEL=$CHANNEL" >> $GITHUB_OUTPUT

      - name: Build waveshare
        run: pio run -e waveshare-esp32-s3-touch-lcd-2

      - name: Upload waveshare artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.ver.outputs.VERSION }}-${{ steps.ver.outputs.CHANNEL }}-waveshare
          path: .pio/build/waveshare-esp32-s3-touch-lcd-2/firmware.bin

      - name: Create Release (waveshare)
        if: startsWith(github.ref, 'refs/tags/fw-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Firmware ${{ steps.ver.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: .pio/build/waveshare-esp32-s3-touch-lcd-2/firmware.bin
